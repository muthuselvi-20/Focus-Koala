<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="koalaFurHappy" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ABC0CE"/>
      <stop offset="100%" stop-color="#73828E"/>
    </radialGradient>
    <radialGradient id="innerEarHappy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD1D1"/>
      <stop offset="100%" stop-color="#E5A6A6"/>
    </radialGradient>
  </defs>
  <!-- Left Ear -->
  <circle cx="50" cy="55" r="32" fill="#8E99A0"/>
  <circle cx="50" cy="55" r="20" fill="url(#innerEarHappy)"/>
  <!-- Right Ear -->
  <circle cx="150" cy="55" r="32" fill="#8E99A0"/>
  <circle cx="150" cy="55" r="20" fill="url(#innerEarHappy)"/>
  <!-- Head -->
  <circle cx="100" cy="105" r="62" fill="url(#koalaFurHappy)"/>
  <!-- Rosy Blush Cheeks -->
  <circle cx="56" cy="120" r="12" fill="#F87171" opacity="0.35"/>
  <circle cx="144" cy="120" r="12" fill="#F87171" opacity="0.35"/>
  <!-- Happy Crescent Eyes (^ ^) -->
  <path d="M 68 96 Q 76 84 84 96" fill="none" stroke="#24272D" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 116 96 Q 124 84 132 96" fill="none" stroke="#24272D" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Big Nose -->
  <ellipse cx="100" cy="112" rx="18" ry="24" fill="#24272D"/>
  <ellipse cx="96" cy="104" rx="5" ry="3" fill="#4B525B"/>
  <!-- Wide Joyful Smile -->
  <path d="M 86 134 Q 100 152 114 134" fill="#E11D48" stroke="#24272D" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Little Sparkles -->
  <polygon points="170,80 173,86 180,89 173,92 170,98 167,92 160,89 167,86" fill="#FBBF24"/>
  <polygon points="30,80 33,86 40,89 33,92 30,98 27,92 20,89 27,86" fill="#FBBF24"/>
</svg>

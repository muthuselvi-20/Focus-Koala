  </defs>
  <!-- Droopy Ears -->
  <circle cx="50" cy="65" r="30" fill="#7C868D"/>
  <circle cx="50" cy="65" r="18" fill="url(#innerEarDisapp)"/>
  <circle cx="150" cy="65" r="30" fill="#7C868D"/>

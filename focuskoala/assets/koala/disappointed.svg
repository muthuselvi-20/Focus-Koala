  <!-- Sweat drop 💧 -->
  <path d="M 148 76 C 148 76 156 86 156 91 C 156 95 152 98 148 98 C 144 98 140 95 140 91 C 140 86 148 76 148 76 Z" fill="#60A5FA"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="koalaFurDisapp" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#9BA4AB"/>
      <stop offset="100%" stop-color="#5F676D"/>
    </radialGradient>
    <radialGradient id="innerEarDisapp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5B2B2"/>
      <stop offset="100%" stop-color="#C48888"/>

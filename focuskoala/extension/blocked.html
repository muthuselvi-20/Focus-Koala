<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusKoala 🐨 — Cooldown Active</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="blocked-page">
  <div class="blocked-card">
    <div class="koala-avatar-container">
      <div id="koala-emoji" class="koala-avatar">🐨</div>
      <div id="status-chip" class="status-chip">Cooldown Active</div>
    </div>

    <h1 id="blocked-headline">Nice try! 😄</h1>
    <p id="blocked-quote" class="quote-text">"Instagram is currently on a break."</p>

    <div class="timer-box">
      <div class="timer-label">REMAINING TIME</div>
      <div id="cooldown-timer" class="timer-digits">01:42</div>
      <div id="attempt-info" class="attempt-badge">Attempt 1</div>
    </div>

    <div class="task-redirection-box">
      <div class="task-header">
        <span class="task-badge">TODAY'S HIGHEST PRIORITY TASK</span>
      </div>
      <div id="task-title" class="task-title">Complete 3 DSA problems</div>
      <p id="task-encouragement" class="task-sub">FocusKoala believes in you. Let's make progress!</p>
      
      <div class="action-buttons">
        <button id="start-task-btn" class="btn-primary">Start Task 🚀</button>
        <button id="view-dashboard-btn" class="btn-secondary">Open FocusKoala</button>
      </div>
    </div>

    <footer class="footer-note">
      FocusKoala Desktop Agent &bull; Distraction Guard
    </footer>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
